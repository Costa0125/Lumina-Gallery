name: Compilar Lumina APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir Lumina
        run: |
          unzip -q Lumina-Android-ready.zip -d project
          chmod +x project/LuminaGallery/gradlew

      - name: Compilar APK
        run: |
          cd project/LuminaGallery
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-APK
          path: project/LuminaGallery/app/build/outputs/apk/debug/*.apk
